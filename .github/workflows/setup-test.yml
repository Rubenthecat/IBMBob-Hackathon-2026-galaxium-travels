name: 🚀 Setup Script Tests

on:
  push:
    paths:
      - setup.sh
      - setup.ps1
      - docker-compose.yml
      - booking_system_backend/**
      - booking_system_frontend/**
      - booking_system_inventory_hold_service/**
  pull_request:
    paths:
      - setup.sh
      - setup.ps1
      - docker-compose.yml
      - booking_system_backend/**
      - booking_system_frontend/**
      - booking_system_inventory_hold_service/**
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Include macOS local mode job'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Docker mode — Ubuntu
  # Validates: setup.sh Docker path + docker-compose.yml default stack
  # ───────────────────────────────────────────────────────────────────────────
  test-docker-ubuntu:
    name: Docker mode (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x setup.sh start.sh scripts/local/start_locally.sh

      - name: Verify Docker is available
        run: docker info

      - name: Start full stack with Docker Compose
        run: docker compose up --build --detach
        timeout-minutes: 15

      - name: Wait for backend
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8001/ > /dev/null 2>&1; then
              echo "✅ Backend is up"; exit 0
            fi
            echo "  attempt $i/20 — waiting 5s..."; sleep 5
          done
          echo "❌ Backend did not start in time"; exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
              echo "✅ Frontend is up"; exit 0
            fi
            echo "  attempt $i/10 — waiting 5s..."; sleep 5
          done
          echo "❌ Frontend did not start in time"; exit 1

      - name: Wait for Java Hold Service
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8082/api/v1/health > /dev/null 2>&1; then
              echo "✅ Java Hold Service is up"; exit 0
            fi
            echo "  attempt $i/20 — waiting 5s..."; sleep 5
          done
          echo "❌ Java Hold Service did not start in time"; exit 1

      - name: Verify all services respond
        run: |
          echo "--- Backend root ---"
          curl -sf http://localhost:8001/ | head -c 200
          echo ""
          echo "--- API docs (HTTP status) ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8001/docs
          echo "--- Frontend (HTTP status) ---"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:5173/
          echo "--- Java Hold Service health ---"
          curl -sf http://localhost:8082/api/v1/health
          echo ""

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --tail=60

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Local mode — Ubuntu (clean runner, no Docker)
  # Validates: setup.sh local path — apt-get installs, venv, npm, Java service
  # ───────────────────────────────────────────────────────────────────────────
  test-local-ubuntu:
    name: Local mode (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x setup.sh start.sh scripts/local/start_locally.sh

      - name: Install system dependencies (mirrors setup.sh local path)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-venv nodejs npm curl lsof maven

      - name: Ensure Java 21 is active (Lombok requires 17 or 21)
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1 | grep -oP '"\K[^"]+' | cut -d. -f1)
          echo "Detected Java major version: $JAVA_VER"
          if [[ "$JAVA_VER" != "17" && "$JAVA_VER" != "21" ]]; then
            echo "Installing Java 21..."
            sudo apt-get install -y openjdk-21-jdk
            sudo update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
          fi
          java -version

      - name: Create frontend .env (mirrors setup.sh behaviour)
        run: |
          if [ ! -f booking_system_frontend/.env ]; then
            cp booking_system_frontend/.env.example booking_system_frontend/.env
            echo "Created .env"
          fi

      - name: Install Python dependencies
        run: |
          cd booking_system_backend
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Install Node dependencies
        run: cd booking_system_frontend && npm install --silent

      - name: Start backend
        run: |
          cd booking_system_backend
          .venv/bin/python server.py > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for backend
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8001/ > /dev/null 2>&1; then
              echo "✅ Backend is up"; exit 0
            fi
            sleep 2
          done
          echo "❌ Backend failed to start"
          cat booking_system_backend/backend.log; exit 1

      - name: Start Java Hold Service
        run: |
          cd booking_system_inventory_hold_service
          PYTHON_BACKEND_URL=http://localhost:8001 mvn -q spring-boot:run > java.log 2>&1 &
          echo "JAVA_PID=$!" >> $GITHUB_ENV

      - name: Wait for Java Hold Service
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "✅ Java Hold Service is up"; exit 0
            fi
            sleep 5
          done
          echo "❌ Java Hold Service failed to start"
          cat booking_system_inventory_hold_service/java.log; exit 1

      - name: Verify services respond
        run: |
          echo "--- Backend ---"
          curl -sf http://localhost:8001/ | head -c 200
          echo ""
          echo "--- Java Hold Service health ---"
          curl -sf http://localhost:8080/api/v1/health
          echo ""

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== backend.log ===" && cat booking_system_backend/backend.log || true
          echo "=== java.log ===" && cat booking_system_inventory_hold_service/java.log || true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Local mode — macOS (manual trigger only)
  # Validates: setup.sh Homebrew install path + OpenJDK PATH quirk on macOS
  # ───────────────────────────────────────────────────────────────────────────
  test-local-macos:
    name: Local mode (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x setup.sh start.sh scripts/local/start_locally.sh

      - name: Install Homebrew (pre-installed on macOS runners — verify)
        run: brew --version

      - name: Install system dependencies via Homebrew (mirrors setup.sh local path)
        run: |
          brew install python@3.11 node openjdk@21 maven curl lsof

      - name: Add Homebrew OpenJDK to PATH (mirrors setup.sh macOS PATH fix)
        run: |
          BREW_JAVA="$(brew --prefix openjdk@21)/bin"
          echo "$BREW_JAVA" >> $GITHUB_PATH
          echo "Added $BREW_JAVA to PATH"

      - name: Verify Java version is 17 or 21
        run: |
          JAVA_VER=$(java -version 2>&1 | head -1 | grep -oE '"[0-9]+' | tr -d '"')
          echo "Java major version: $JAVA_VER"
          if [[ "$JAVA_VER" != "17" && "$JAVA_VER" != "21" ]]; then
            echo "❌ Unexpected Java version: $JAVA_VER (need 17 or 21)"; exit 1
          fi
          java -version

      - name: Create frontend .env (mirrors setup.sh behaviour)
        run: |
          if [ ! -f booking_system_frontend/.env ]; then
            cp booking_system_frontend/.env.example booking_system_frontend/.env
            echo "Created .env"
          fi

      - name: Install Python dependencies
        run: |
          cd booking_system_backend
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Install Node dependencies
        run: cd booking_system_frontend && npm install --silent

      - name: Start backend
        run: |
          cd booking_system_backend
          .venv/bin/python server.py > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for backend
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8001/ > /dev/null 2>&1; then
              echo "✅ Backend is up"; exit 0
            fi
            sleep 2
          done
          echo "❌ Backend failed to start"
          cat booking_system_backend/backend.log; exit 1

      - name: Start Java Hold Service
        run: |
          cd booking_system_inventory_hold_service
          PYTHON_BACKEND_URL=http://localhost:8001 mvn -q spring-boot:run > java.log 2>&1 &
          echo "JAVA_PID=$!" >> $GITHUB_ENV

      - name: Wait for Java Hold Service
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "✅ Java Hold Service is up"; exit 0
            fi
            sleep 5
          done
          echo "❌ Java Hold Service failed to start"
          cat booking_system_inventory_hold_service/java.log; exit 1

      - name: Verify services respond
        run: |
          echo "--- Backend ---"
          curl -sf http://localhost:8001/ | head -c 200
          echo ""
          echo "--- Java Hold Service health ---"
          curl -sf http://localhost:8080/api/v1/health
          echo ""

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== backend.log ===" && cat booking_system_backend/backend.log || true
          echo "=== java.log ===" && cat booking_system_inventory_hold_service/java.log || true

# Made with Bob
