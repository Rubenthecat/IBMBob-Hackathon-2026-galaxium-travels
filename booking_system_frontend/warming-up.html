<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="60">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxium Travels — Starting Up</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(to bottom, #030712, #0A1929);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F9FAFB;
    }

    .card {
      text-align: center;
      max-width: 520px;
      padding: 3rem 2rem;
    }

    /* Rocket icon */
    .rocket {
      font-size: 4rem;
      display: block;
      animation: launch 2s ease-in-out infinite;
    }

    @keyframes launch {
      0%, 100% { transform: translateY(0);   }
      50%       { transform: translateY(-14px); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 1.25rem 0 0.5rem;
      background: linear-gradient(135deg, #6366F1, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Progress bar */
    .bar-wrap {
      background: rgba(99, 102, 241, 0.15);
      border-radius: 9999px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .bar {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #6366F1, #EC4899);
      animation: fill 60s linear forwards;
    }

    @keyframes fill {
      from { width: 0%; }
      to   { width: 100%; }
    }

    .countdown {
      font-size: 0.875rem;
      color: #64748b;
    }

    #secs {
      font-variant-numeric: tabular-nums;
      color: #6366F1;
      font-weight: 600;
    }

    /* Stars */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #F9FAFB;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    .note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #475569;
      font-style: italic;
    }
  </style>
</head>
<body>
  <!-- Twinkling star field -->
  <div class="stars" id="stars"></div>

  <div class="card">
    <span class="rocket">🚀</span>
    <h1>Starting up application…</h1>
    <p class="subtitle">
      Please wait ~60 seconds and refresh.<br>
      <strong style="color:#F9FAFB;">The backend is warming up.</strong>
    </p>

    <div class="bar-wrap">
      <div class="bar"></div>
    </div>

    <p class="countdown">Auto-refreshing in <span id="secs">60</span>s</p>

    <p class="note">(This Hackathon user is trying to save money)</p>
  </div>

  <script>
    // Countdown timer
    var secs = 60;
    var el = document.getElementById('secs');
    var timer = setInterval(function () {
      secs -= 1;
      if (secs <= 0) { clearInterval(timer); el.textContent = '0'; return; }
      el.textContent = secs;
    }, 1000);

    // Generate random star field
    var container = document.getElementById('stars');
    for (var i = 0; i < 80; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top  = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      s.style.animationDuration = (2 + Math.random() * 2).toFixed(2) + 's';
      container.appendChild(s);
    }
  </script>
</body>
</html>
