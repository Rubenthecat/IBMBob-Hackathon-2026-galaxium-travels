# Disable async I/O to fix io_setup() errors on macOS Docker
aio off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Docker Compose DNS resolver — resolves upstream names at request time,
    # not at nginx startup, so nginx starts even if backend isn't up yet.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;
    # Serve warming-up page for backend gateway errors (cold start UX)
    error_page 502 503 504 /warming-up.html;
    location = /warming-up.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Proxy API requests to the backend; BACKEND_URL is injected at container
    # startup via docker-entrypoint.sh (envsubst). Default: http://backend:8080
    # so Docker Compose local dev requires no env var.
    location /api/ {
        set $backend_upstream ${BACKEND_URL};
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Extended timeouts to handle backend cold starts
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA routing - serve index.html for all routes (must be last)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

